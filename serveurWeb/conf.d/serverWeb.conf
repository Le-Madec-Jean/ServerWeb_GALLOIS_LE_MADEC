        <port>80</port>
        <DocumentRoot>../var/www</DocumentRoot>
        <DefaultIndex>index.html</DefaultIndex>
        <Acceslog>../var/log/access.log</Acceslog>
        <Errorlog>../var/log/error.log</Errorlog>
    </site>
    <site>
        <port>8080</port>
